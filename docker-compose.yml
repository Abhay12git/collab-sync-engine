version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: collab_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  redis:
    image: redis:7.0-alpine
    container_name: collab_redis
    ports:
      - '6379:6379'

volumes:
  mongo_data:
